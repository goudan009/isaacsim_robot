schema_version: 1

runtime:
  mode: robot_mounted
  quality_level: L0_aligned_fast
  physics_hz: 90
  render_hz: 60

queues:
  ros2_queue_size: 5

cameras:
  base_d435:
    enabled: true
    model: D435
    parent_prim: /World/OpenFlex/Geometry/base_link
    mount_prim_path: /World/OpenFlex/Geometry/base_link/CameraMount
    # USD cameras look along local -Z. Keep the released forward-facing pose,
    # with a small downward pitch so the robot-only validation stage sees the
    # ground plane instead of an empty horizon.
    local_pose: {translation_m: [0.65, 0.0, 0.055], quaternion_wxyz: [0.79335334, 0.0, -0.60876143, 0.0]}
    node_namespace: cam_base
    optical_frame: cam_base_color_optical_frame
    tick_rate_hz: 30.0
    width: 640
    height: 480
    focal_length_mm: 3.2
    near_m: 0.05
    far_m: 10.0
    calibration_id: d435_nominal_640x480_rectified_v1
    baseline_mm: 50.0
    depth_focal_length_px: 615.0
    depth_min_m: 0.30
    depth_max_m: 3.00
    imu: {enabled: false}

  head_d435:
    enabled: true
    model: D435
    parent_prim: /World/OpenFlex/Geometry/base_link/lift_carriage_link/head_pitch_link/head_yaw_link
    mount_prim_path: /World/OpenFlex/Geometry/base_link/lift_carriage_link/head_pitch_link/head_yaw_link/HeadCameraMount
    # Match the released head-camera geometry used by the robot asset. The
    # optical center is on the front shell, outside the head collision mesh.
    local_pose: {translation_m: [-0.5631, 0.0824, -0.1072], quaternion_wxyz: [0.70710677, 0.0, -0.70710677, 0.0]}
    node_namespace: cam_head
    optical_frame: cam_head_color_optical_frame
    tick_rate_hz: 30.0
    width: 640
    height: 480
    focal_length_mm: 3.2
    near_m: 0.05
    far_m: 10.0
    calibration_id: d435_nominal_640x480_rectified_v1
    baseline_mm: 50.0
    depth_focal_length_px: 615.0
    depth_min_m: 0.30
    depth_max_m: 3.00
    imu: {enabled: false}

  left_wrist_d405:
    enabled: true
    model: D405
    parent_prim: /World/OpenFlex
    mount_prim_path: /World/OpenFlex/Geometry/base_link/lift_carriage_link/openarmx_left_link1/openarmx_left_link2/openarmx_left_link3/openarmx_left_link4/openarmx_left_link5/openarmx_left_link6/openarmx_left_link7/OpenFlexRuntimeLinks/openarmx_left_hand/LeftWristCameraMount
    local_pose: {translation_m: [0.06720526, -0.01250108, -0.06167065], quaternion_wxyz: [0.30070580, 0.0, 0.95371695, 0.0]}
    node_namespace: cam_left
    optical_frame: cam_left_color_optical_frame
    tick_rate_hz: 30.0
    width: 640
    height: 480
    focal_length_mm: 3.2
    near_m: 0.03
    far_m: 3.0
    calibration_id: d405_nominal_640x480_rectified_v1
    baseline_mm: 18.0
    depth_focal_length_px: 615.0
    depth_min_m: 0.07
    depth_max_m: 0.50
    imu: {enabled: false}

  right_wrist_d405:
    enabled: true
    model: D405
    parent_prim: /World/OpenFlex
    mount_prim_path: /World/OpenFlex/Geometry/base_link/lift_carriage_link/openarmx_right_link1/openarmx_right_link2/openarmx_right_link3/openarmx_right_link4/openarmx_right_link5/openarmx_right_link6/openarmx_right_link7/OpenFlexRuntimeLinks/openarmx_right_hand/RightWristCameraMount
    local_pose: {translation_m: [0.06721000, -0.01250000, -0.06167000], quaternion_wxyz: [-0.30070580, 0.0, -0.95371695, 0.0]}
    node_namespace: cam_right
    optical_frame: cam_right_color_optical_frame
    tick_rate_hz: 30.0
    width: 640
    height: 480
    focal_length_mm: 3.2
    near_m: 0.03
    far_m: 3.0
    calibration_id: d405_nominal_640x480_rectified_v1
    baseline_mm: 18.0
    depth_focal_length_px: 615.0
    depth_min_m: 0.07
    depth_max_m: 0.50
    imu: {enabled: false}
